<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>载具样机 · 太阳系漫游</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/lab/lab.css"><script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head>
<body><header><span>太阳系漫游 / 载具样机</span><small>独立美术实验 · 尚未进入游戏</small></header><aside><h1>看清每一面。</h1><p>拖动旋转，滚轮放大。用同一光照比较原材质与修整版。</p><label>载具<select id="vehicle"></select></label><label>材质<select id="variant"><option value="refined">修整版</option><option value="assembled">装配版（原材质）</option><option value="original">原文件（未经装配）</option><option value="materials-only">仅改材质（未经装配）</option></select></label><label>观察方式<select id="view"><option value="inspect">完整结构</option><option value="detail">主体放大</option><option value="formation">伴飞占屏示意</option></select></label><label>光照<select id="lighting"><option value="studio">中性摄影棚</option><option value="space">单太阳光</option><option value="assisted">伴飞辅助光</option></select></label><label>太阳方向<select id="sun"><option value="front">正面</option><option value="side">掠射</option><option value="back">背面</option></select></label><div class="angles"><button data-angle="front">正面</button><button data-angle="rear">背面</button><button data-angle="belly">腹面</button></div><button id="reset">恢复取景</button><p id="status" role="status"></p><details><summary>这份样机检查什么</summary><p>材质、完整轮廓、反面与薄面。伴飞画面采用当前游戏的 45° 视场和右下方位置，但背景只是构图标记，不能代替游戏内验证。</p><p>“单太阳光”关闭摄影棚反射与辅助灯；阴影面变暗属于光照结果，不能用自发光补成假金属。</p></details></aside><main id="stage" aria-label="载具三维预览"><div id="planet" hidden><span>星球主体构图参考</span></div><div class="stage-label"><b id="name"></b><span id="description"></span></div><div id="metrics"></div></main><script type="module" src="/lab/lab.mjs"></script></body></html>
