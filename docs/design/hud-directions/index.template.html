heme-c .identity{display:flex;align-items:center;gap:24px}.scheme-c .name{font-size:21px}.scheme-c .readout{display:flex;gap:12px;align-items:baseline;border-left:1px solid #c2dce244;padding-left:24px}.scheme-c .main-value{font-size:33px}.scheme-c .ribbon{position:absolute;left:52px;right:52px;bottom:85px;height:38px}.scheme-c .ribbon text{font-size:10px;letter-spacing:1px}.scheme-c .axis-title{position:absolute;bottom:122px;left:52px;font-size:9px;color:#b2cbd2;letter-spacing:2px}.scheme-c .center-note{position:absolute;bottom:35px;left:720px;right:720px;text-align:center;font-size:10px;color:#a1b9c0;letter-spacing:2px}.panel{position:absolute;right:48px;bottom:165px;width:320px;padding:25px;background:#c7dce016;backdrop-filter:blur(20px);border:1px solid #d3e8ef40;border-radius:6px;color:#e5eff0;line-height:2}.panel h3{margin:0 0 10px;font-size:17px;font-weight:400}.panel p{font-size:12px;margin:0;color:#b9cacf}.panel .close{position:absolute;right:13px;top:13px;background:none;font-size:18px}.hint{position:absolute;left:50%;top:88px;transform:translateX(-50%);background:#112229db;border:1px solid #bfd9e43b;border-radius:6px;padding:12px 22px;font-size:13px}.prototype-note{position:absolute;top:87px;right:40px;font-size:10px;color:#adc0c7;letter-spacing:2px}.baseline .topline,.baseline .hud,.baseline .prototype-note{display:none}.immersive .heading,.immersive .caption,.immersive .footnote{display:none}.immersive .workbench{max-width:none;padding:10px}.immersive .preview-shell{max-height:calc(100vh - 76px);margin:auto;max-width:calc((100vh - 76px)*16/9)}.sheet{display:none}.sheet-mode .workbench{display:none}.sheet-mode .sheet{display:block}.sheet{width:1920px;background:#13191c;padding:32px 40px 25px}.sheet h1{font-size:26px;font-weight:400;letter-spacing:1px;margin:0 0 8px}.sheet .intro{font-size:13px;color:#93a8b0;margin-bottom:25px}.sheet-row{margin-top:20px;border:1px solid #4f606544;position:relative;background:#050708;border-radius:5px;overflow:hidden}.sheet-label{height:46px;display:flex;align-items:center;padding:0 22px;gap:22px;background:#192226}.sheet-label b{font-size:16px;font-weight:400;letter-spacing:2px}.sheet-label span{font-size:12px;color:#a0b5bd}.sheet-crop{height:240px;position:relative;overflow:hidden}.sheet-crop .viewport{top:-820px;left:0;transform:scale(.958333);transform-origin:top left}.sheet .sheet-footer{font-size:12px;color:#9bafb6;margin-top:22px;line-height:1.8}.sheet-mode{background:#13191c}.sheet-mode .hud{background:linear-gradient(transparent,rgba(8,14,18,.8) 68%,rgba(8,14,18,.94))}

<body><main class="workbench">
<header class="heading"><div><div class="eyebrow">SOLAR EXPLORER / INTERFACE STUDIES / 03</div><h1>给漫游一点仪式感。</h1></div><p>独立设计比较 · 当前游戏画面作背景 · 数值与图示为样张</p></header>
<nav class="toolbar" aria-label="设计比较控制"><div class="seg schemes"><button data-scheme="a">A　任务弧</button><button data-scheme="b">B　轨道透镜</button><button data-scheme="c">C　地平线罗盘</button></div><div class="seg phases"><button data-phase="orbit">观星</button><button data-phase="descent">下降</button><button data-phase="ground">地面</button></div><div class="right"><button class="tool" id="baseline">对照当前版</button><button class="tool" id="immersive">放大预览</button></div></nav>
<section class="preview-shell" aria-label="HUD方案预览"><div class="viewport" id="preview"></div></section>
<section class="caption"><div class="title"><span class="code" id="design-code"></span><h2 id="design-title"></h2></div><div><p id="design-description"></p><p id="phase-description"></p></div></section>
<footer class="footnote"><span class="swatch"></span>共同约束：薄底栏、一个图形主体、一个主读数；动作常驻，科普按需展开。按 1 / 2 / 3 换方案，按 O / D / G 换阶段，Esc 关闭说明。<br>参考 <a href="https://www.ericdaly.com/spacex-launch-gfx" target="_blank" rel="noopener">SpaceX 直播图形设计案例</a>中的曲率、层级与阶段组织。本页是设计样张，未替换游戏 HUD；不包含真实火箭遥测。顶栏简化为共享占位，供公平比较底部设计。</footer>
</main><div class="sheet" id="sheet"></div>
<script>
const BG=__BACKGROUNDS__;
const designs={a:{name:'任务弧',en:'MISSION ARC',description:'以一条浅弧组织任务，留住直播仪表的秩序感。左侧交代地点，弧线与主读数居中，右侧留给控制；银白线条直接悬浮在画面上。',phase:{orbit:'观星时只保留火星与两颗卫星的关系，观察机位用三角标记，点击详情才展开完整星系。',descent:'弧线表达接近 → 下降 → 抵达的阶段；只在中心放离地高度，不重复放进度百分比或假飞船速度。',ground:'落地后任务弧收成方位弧，主读数自然换为视线朝向，环顾方向有了安静的视觉回声。'}},b:{name:'轨道透镜',en:'ORBITAL LENS',description:'一枚小型位置透镜嵌入低矮的磨砂玻璃条。把“我在哪里”留在左侧，读数和操作横向展开；三套中空间定位感最强。',phase:{orbit:'透镜只画当前火星系统与观察机位，不重新画一整套太阳系；明确为相对关系示意。',descent:'透镜显示本段观察机位与目标落区的关系，右侧显示离地高度；球面弧为示意，非飞船预测轨道。',ground:'透镜切为当地平面，视线扇区指向当前朝向；地点与视向组合，不伪造雷达扫描、障碍物或探测结果。'}},c:{name:'地平线罗盘',en:'HORIZON RIBBON',description:'用贯穿画面的浅弧建立空间感，读数与控制压在两侧，中间保持透空。最轻、最像观察仪器，科幻感来自比例与刻度。',phase:{orbit:'只展开当前系统的几何关系，沿薄弧排布天体与机位；不再显示第二张全星系导航。',descent:'浅弧切换为有明确标签的对数高度尺。位置标记由实际离地高度驱动，不将时间进度伪装成地理距离。',ground:'整条浅弧成为方位带，当前视线在中央标记；地点和主读数仍在左下，右侧保留返回与详情。'}}};
let scheme='a',phase='descent',baseline=false,held=false,panel=false;const qs=new URLSearchParams(location.search);scheme=qs.get('scheme')||scheme;phase=qs.get('phase')||phase;
const data={orbit:{location:'火星',english:'MARS SYSTEM',stage:'当地观星',value:'火星系',unit:'',label:'观察范围',sub:'火卫一 / 火卫二'},descent:{location:'耶泽罗陨石坑',english:'JEZERO / MARS',stage:'下降导览',value:'27.4',unit:'km',label:'离地高度',sub:'接近当地地形'},ground:{location:'耶泽罗陨石坑',english:'JEZERO / MARS',stage:'地面环顾',value:'115',unit:'° ESE',label:'视线方位',sub:'18.45° N　77.44° E'}};
function marker(x,y){return `<path d="M${x-5} ${y-11}L${x+5} ${y-11}L${x} ${y-3}Z" fill="#d3eff5"/><circle cx="${x}" cy="${y}" r="2.5" fill="#effaff"/>`;}
function arc(s,p){
 const d=data[p];
 if(s==='a'){
  const pts=p==='orbit'?[[65,43,'火星'],[310,15,'火卫一'],[555,19,'火卫二'],[715,43,'机位']]:p==='ground'?[[65,43,'NE'],[235,19,'E'],[390,13,'ESE'],[545,19,'SE'],[715,43,'S']]:[[65,43,'观测'],[265,16,'接近'],[485,16,'下降'],[715,43,'抵达']];
  return `<svg width="780" height="67" viewBox="0 0 780 67"><path class="fine" d="M25 55 Q390 -32 755 55"/><path class="bright" d="${p==='descent'?'M25 55 Q225 9 485 16':p==='ground'?'M345 11 Q390 9 435 11':'M25 55 Q150 24 310 15'}"/>${pts.map(([x,y,t],i)=>`<circle cx="${x}" cy="${y}" r="${p==='orbit'&&i===0?5:2}" fill="${p==='descent'&&i>2?'#71878e':'#e4f2f5'}"/><text x="${x}" y="${y-13}" text-anchor="middle" fill="${(p==='descent'&&i===2)||(p==='ground'&&i===2)?'#f2faff':'#b2c4ca'}">${t}</text>`).join('')}${p==='ground'?marker(390,13):p==='descent'?marker(485,16):marker(715,43)}</svg>`;
 }
 if(s==='b'){
 if(p==='orbit')return `<svg viewBox="0 0 118 98"><ellipse cx="57" cy="51" rx="49" ry="22" class="fine" transform="rotate(-18 57 51)"/><ellipse cx="57" cy="51" rx="30" ry="13" class="fine" transform="rotate(-18 57 51)"/><circle cx="57" cy="51" r="12" fill="#dcecf222" stroke="#d9edf3"/><path d="M48 48 Q57 41 66 48M49 55Q57 60 65 55" class="fine"/><circle cx="79" cy="36" r="2.2" fill="#eefaff"/><circle cx="12" cy="64" r="2.2" fill="#eefaff"/>${marker(91,65)}<text x="58" y="92" text-anchor="middle" class="muted" style="font-size:8px">系统关系 · 示意</text></svg>`;
 if(p==='descent')return `<svg viewBox="0 0 118 98"><circle cx="57" cy="65" r="24" class="fine"/><path d="M33 65Q57 49 81 65M57 41Q44 64 57 89" class="fine"/><path d="M21 42Q54 3 99 32" class="fine" stroke-dasharray="3 4"/><path d="M63 16Q73 32 67 45" class="bright"/>${marker(63,16)}<circle cx="67" cy="45" r="3" fill="#e3f8ff"/><path d="M67 39V51M61 45H73" class="fine"/><text x="6" y="78" class="muted" style="font-size:8px">落区</text><path d="M29 75L64 49" class="fine"/><text x="59" y="98" text-anchor="middle" class="muted" style="font-size:8px">关系示意</text></svg>`;
 return `<svg viewBox="0 0 118 98"><circle cx="57" cy="52" r="33" class="fine"/><circle cx="57" cy="52" r="17" class="fine" stroke-dasharray="2 4"/><path d="M57 52L88 55A32 32 0 0 1 77 78Z" fill="#cceefa20"/><path d="M57 15V22M57 82V89M20 52H27M87 52H94" class="bright"/><text x="57" y="10" text-anchor="middle" class="muted" style="font-size:9px">N</text><path d="M57 52L83 64" class="bright"/><circle cx="57" cy="52" r="3" fill="#ecfaff"/><text x="58" y="98" text-anchor="middle" class="muted" style="font-size:8px">视向 · 北向上</text></svg>`;
 }
 const labels=p==='orbit'?['火星','火卫一','观察机位','火卫二']:p==='ground'?['NE 45°','E 90°','ESE 115°','SE 135°','S 180°']:['1,000 km','100 km','10 km','1 km','100 m','10 m','地面'];
 const n=labels.length,yAt=x=>8+28*((x-908)/908)**2,markX=p==='descent'?100+(6-Math.log10(27400))/6*1616:p==='orbit'?100+1616*2/3:908;
 return `<svg width="1816" height="40" viewBox="0 0 1816 40"><path class="fine" d="M0 36Q908 -19 1816 36"/>${Array.from({length:65},(_,i)=>{const x=i*1816/64,y=yAt(x);return `<path class="fine" d="M${x} ${y}v${i%8===0?8:3}"/>`;}).join('')}${labels.map((t,i)=>{const x=p==='ground'?908+([45,90,115,135,180][i]-115)*9:100+i*(1616/(n-1)),y=yAt(x);return `<text x="${x}" y="${y-11}" text-anchor="middle" fill="#b5cad1">${t}</text>`;}).join('')}${marker(markX,yAt(markX))}</svg>`;
}
function buttons(p){return `<div class="actions">${p==='orbit'?'<button class="action primary" data-action="land">降落　↘</button>':p==='descent'?`<button class="action primary" data-action="hold">${held?'▷ 继续下降':'Ⅱ 悬停环顾'}</button><button class="action" data-action="return">返回高空 ↗</button>`:'<button class="action primary" data-action="return">返回高空　↗</button>'}<span class="rule"></span><button class="action" data-action="info">${p==='orbit'?'资料':'详情'}</button><button class="icon-button" data-action="more" aria-label="更多设置">···</button></div>`;}
function hud(s,p){const d=data[p],value=p==='orbit'?'火星系':d.value,sub=p==='descent'&&held?'悬停环顾':d.stage;let inside='';
 if(s==='a')inside=`<div class="identity"><div class="kicker">${d.english}</div><div class="name">${d.location}</div><div class="sub"><i class="status"></i>${sub}</div></div><div class="instrument">${arc(s,p)}<div class="readout"><span class="reading-label">${d.label}</span><span class="num main-value" style="${p==='orbit'?'font-size:23px;letter-spacing:4px':''}">${value}<span class="unit">${d.unit}</span></span></div><span class="legend">${p==='orbit'?'关系示意':p==='descent'?'任务阶段':'方位'}</span></div>${buttons(p)}`;
 if(s==='b')inside=`<div class="capsule"><div class="lens">${arc(s,p)}</div><div class="identity"><div class="kicker">${d.english}</div><div class="name">${d.location}</div><div class="sub">${p==='ground'?d.sub:p==='orbit'?'火卫一 / 火卫二':'火星 · 目标落区'}</div></div><div class="reading"><span class="kicker">${d.label}</span><span class="num main-value" style="${p==='orbit'?'font-size:25px;letter-spacing:2px':''}">${value}<span class="unit">${d.unit}</span></span></div><div class="phase-beads"><span>${sub}</span>${p==='descent'?'<i class="past"></i><i class="past"></i><b></b><i></i>':''}</div>${buttons(p)}</div>`;
 if(s==='c')inside=`<span class="axis-title">${p==='orbit'?'当前系统 / 关系示意':p==='ground'?'视线方位 / 当地水平面':'离地高度 / 对数刻度'}</span><div class="ribbon">${arc(s,p)}</div><div class="lower"><div class="identity"><div><div class="kicker">${d.english}</div><div class="name">${d.location}</div></div><div class="readout"><span class="num main-value" style="${p==='orbit'?'font-size:22px':''}">${p==='orbit'?'当地观星':d.value}<span class="unit">${d.unit}</span></span>${p==='orbit'?'':`<span class="sub">${d.label}</span>`}</div></div>${buttons(p)}</div><span class="center-note">${p==='ground'?'拖动环顾 · 抬头仰望':sub}</span>`;
 if(p==='orbit')inside=inside.replace('<button class="action primary" data-action="land">','<button class="site-selector" data-action="site">耶泽罗 ▾</button><button class="action primary" data-action="land">');
 if(s==='a'&&p==='ground')inside=inside.replace('<span class="legend">方位</span>','');
 if(s==='c'&&p==='descent')inside=inside.replace('<span class="sub">离地高度</span>','');
 if(s==='c'&&p==='orbit')inside=inside.replace('<span class="center-note">当地观星</span>','');
 return `<div class="hud scheme-${s}" data-hud="${s}">${inside}</div>`;
}
function scene(s,p,base=false){return `<div class="scene" style="background-image:url('${BG[p+(base?'-current':'')]}')"></div><div class="topline"><span class="brand">太阳系漫游</span><span class="crumb">太阳系　/　火星　${p==='orbit'?'':'/　耶泽罗'}</span><span class="topright">机库　　书签　　明信片　　⋯</span></div><span class="prototype-note">HUD DESIGN STUDY · ${s.toUpperCase()}</span>${hud(s,p)}`;}
function resize(){const box=document.querySelector('.preview-shell');document.querySelector('#preview').style.transform=`scale(${box.clientWidth/1920})`;}
function render(){document.querySelector('#preview').classList.toggle('baseline',baseline);document.querySelector('#preview').innerHTML=scene(scheme,phase,baseline);document.querySelectorAll('[data-scheme]').forEach(b=>b.classList.toggle('active',b.dataset.scheme===scheme));document.querySelectorAll('[data-phase]').forEach(b=>b.classList.toggle('active',b.dataset.phase===phase));const d=designs[scheme];document.querySelector('#design-code').textContent=`${scheme.toUpperCase()} / ${d.en}`;document.querySelector('#design-title').textContent=d.name;document.querySelector('#design-description').textContent=d.description;document.querySelector('#phase-description').innerHTML=`<strong>${({orbit:'观星',descent:'下降',ground:'地面'})[phase]}</strong> · ${d.phase[phase]}`;document.querySelector('#baseline').classList.toggle('on',baseline);document.querySelector('#baseline').textContent=baseline?'返回设计方案':'对照当前版';panel=false;resize();}
document.querySelectorAll('[data-scheme]').forEach(b=>b.onclick=()=>{scheme=b.dataset.scheme;baseline=false;render();});document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{phase=b.dataset.phase;held=false;render();});document.querySelector('#baseline').onclick=()=>{baseline=!baseline;render();};document.querySelector('#immersive').onclick=()=>{document.body.classList.toggle('immersive');resize();};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='hold'){held=!held;render();return;}if(action==='return'||action==='land'){phase=action==='return'?'orbit':'descent';held=false;render();return;}document.querySelector('.panel')?.remove();if(panel){panel=false;return;}panel=true;const el=document.createElement('aside');el.className='panel';el.innerHTML=`<button class="close" aria-label="关闭说明">×</button><div class="kicker">${action==='info'?'CONTEXT':'OBSERVATION'}</div><h3>${action==='info'?'位置与观察':'观察设置'}</h3><p>${action==='info'?designs[scheme].phase[phase]:'时间倍率、白昼选择、光照与图层放在这里；默认底栏只留下当前最需要的动作。'}</p><p style="margin-top:15px;font-size:10px;color:#829ba3">设计交互示例，未连接引擎。</p>`;document.querySelector('#preview').append(el);el.querySelector('.close').onclick=()=>{el.remove();panel=false;};});
document.addEventListener('click',e=>{if(!e.target.closest('[data-action="site"]'))return;e.stopImmediatePropagation();document.querySelector('.panel')?.remove();const el=document.createElement('aside');el.className='panel';el.innerHTML='<button class="close" aria-label="关闭落区列表">×</button><div class="kicker">LANDING SITES</div><h3>选择落区</h3><div class="site-option">● 耶泽罗陨石坑</div><div class="site-option">○ 维多利亚陨石坑</div><div class="site-option">○ 盖尔陨石坑</div><p style="margin-top:14px">落区列表布局示例。本页取景固定为耶泽罗。</p>';document.querySelector('#preview').append(el);panel=true;el.querySelector('.close').onclick=()=>{el.remove();panel=false;};},true);
document.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)){scheme=['a','b','c'][+e.key-1];baseline=false;render();}const phases={o:'orbit',d:'descent',g:'ground'};if(phases[e.key.toLowerCase()]){phase=phases[e.key.toLowerCase()];render();}if(e.key==='Escape'){document.querySelector('.panel')?.remove();panel=false;document.body.classList.remove('immersive');resize();}});window.addEventListener('resize',resize);
if(qs.has('sheet')){document.body.classList.add('sheet-mode');document.querySelector('#sheet').innerHTML=`<h1>同一个世界，三种观察方式。</h1><div class="intro">太阳系漫游 / HUD 设计比较　·　${({orbit:'观星',descent:'下降',ground:'地面'})[phase]}状态　·　1920 × 1080 实机背景，以下仅截取底部区域；仪表数值为方案示例</div>${['a','b','c'].map(s=>`<section class="sheet-row"><div class="sheet-label"><b>${s.toUpperCase()}　${designs[s].name}</b><span>${({a:'任务弧线 + 中心主读数　/　直播仪表气质',b:'微型位置透镜 + 薄磨砂底　/　空间定位感',c:'全宽浅弧 + 两侧信息　/　最轻的观察仪器'})[s]}</span></div><div class="sheet-crop"><div class="viewport">${scene(s,phase)}</div></div></section>`).join('')}<div class="sheet-footer">同阶段统一内容：地点、阶段、一个主读数与必要操作。燃料、推力、虚构航速均不加入。完整预览可切换三阶段，并与当前版同机位对照。</div>`;}
render();window.__hudPreview={set:(s,p)=>{scheme=s;phase=p;baseline=false;render();}};
</script></body></html>
